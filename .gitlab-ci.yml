variables:
  GIT_CLONE_PATH: ${CI_BUILDS_DIR}/${CI_PROJECT_NAME}
  FLEUR_CI_FEATURE_OPTIONS: "-libxc TRUE -wannier TRUE -includedir /opt/fleur-deps/include -libdir /opt/fleur-deps/lib"

stages:
   - build
   - fast-test
   - test
   - perf
   - html
   - deploy
   - review

include:
   - "packaging/CI/test-template.yml"
   - "packaging/CI/gfortran-hdf.yml"
   - "packaging/CI/gfortran-serial.yml"
   - "packaging/CI/oneAPI.yml"
   - "packaging/CI/NVHPC.yml"
   - "packaging/CI/LLVM.yml"
   - "packaging/CI/html.yml"
   - "packaging/CI/AiiDA.yml"
   - "packaging/CI/CB.yml"
   - "packaging/CI/CLAUDE.yml"
