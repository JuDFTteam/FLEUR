  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0  # Use the ref you want to point at
    hooks:
    -   id: check-added-large-files
    -   id: check-case-conflict
    -   id: check-merge-conflict
    -   id: check-toml
    -   id: check-xml
    -   id: check-yaml
  - repo: https://iffgit.fz-juelich.de/fleur/fleur-pre-commit.git
    rev: v0.2.1
    hooks:
    -   id: check-copyright
    -   id: check-use-placement
        exclude: ^(cmake/tests|src/tools/mini-apps|testing/small-testcodes)/
    -   id: check-implicit-none
    -   id: check-stop
        exclude: ^src/libraries/juDFT/
    -   id: check-private
        exclude: ^(cmake/tests|src/tools/mini-apps|testing/small-testcodes)/
    -   id: check-forbidden-use
        args: [--forbid=m_types,m_types_setup]

