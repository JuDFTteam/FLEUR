image:
  name: iffregistry.fz-juelich.de/fleur/fleur:NVHPC_23102026
  entrypoint: ["/usr/bin/bash -i -c"]

build-nvhpc-cpu:
  image:  
  stage: build
  tags:
      - rtx2080ti
  artifacts:
     paths:
       - build
     expire_in: 12h
  script:
    - set +e;source compiler-select nvhpc-26.5;set -e
    - nvfortran --version
    - cd $CI_PROJECT_DIR
    - ./configure.sh  -c nvidia -make -link "/opt/nvidia_hpc_sdk_26.5/Linux_x86_64/26.5/compilers/lib/liblapack.a /opt/nvidia_hpc_sdk_26.5/Linux_x86_64/26.5/compilers/lib/libblas.a" $FLEUR_CI_FEATURE_OPTIONS
  allow_failure: true
  rules:
      - if: $CI_TASKS =~ /nvidia/     
      - if: $CI_TASKS =~ /all/    
 
test-nvhpc-cpu:
  image: 
  extends: .test-fleur
  tags:
     - rtx2080ti
  variables:
    BUILD_FOLDER: build
    LD_LIBRARY_PATH: /opt/nvidia_hpc_sdk_26.5/Linux_x86_64/26.5/cuda/lib64:${LD_LIBRARY_PATH}
  before_script:
    - pip install pytest-html
    - set +e; source compiler-select nvhpc-26.5  ;set -e
  needs: 
    - build-nvhpc-cpu
  allow_failure: true
  rules:
      - if: $CI_TASKS =~ /nvidia/    
      - if: $CI_TASKS =~ /all/    
  
build-nvhpc-gpu:
  image:  
  stage: build
  tags:
      - rtx2080ti
  artifacts:
    paths:
      - build
    expire_in: 12h
  script:
    - set +e;source compiler-select nvhpc-26.5 cuda-12.9;set -e
    # nvfortran 26.5 has no CUDA toolkit matching the runner's driver; use the separate CUDA 12.9
    - export NVHPC_CUDA_HOME=${CUDA_HOME:-$(dirname $(dirname $(which -a nvcc | grep -v nvidia_hpc_sdk | head -1)))}
    - export LD_LIBRARY_PATH=${NVHPC_CUDA_HOME}/lib64:${LD_LIBRARY_PATH}
    - echo "NVHPC_CUDA_HOME=${NVHPC_CUDA_HOME}"; nvcc --version | tail -2
    - nvfortran --version
    - cd $CI_PROJECT_DIR
    - ./configure.sh  -c nvidia -gpu acc:cc75 -make -link "/opt/nvidia_hpc_sdk_26.5/Linux_x86_64/26.5/compilers/lib/liblapack.a /opt/nvidia_hpc_sdk_26.5/Linux_x86_64/26.5/compilers/lib/libblas.a" $FLEUR_CI_FEATURE_OPTIONS -wannier FALSE
  allow_failure: true
  rules:
    - if: $CI_TASKS =~ /gpu/
    - if: $CI_COMMIT_BRANCH =~ /gpu/
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_MESSAGE =~ /gpu/'
    - if: $CI_TASKS =~ /all/    

test-nvhpc-gpu:
  image: 
  extends: .test-fleur
  tags:
     - rtx2080ti
  variables:
    BUILD_FOLDER: build
    LD_LIBRARY_PATH: /opt/nvidia_hpc_sdk_26.5/Linux_x86_64/26.5/cuda/lib64:${LD_LIBRARY_PATH}
  before_script:
    - pip install pytest-html
    - set +e;source compiler-select nvhpc-26.5 cuda-12.9;set -e
    # nvfortran 26.5 has no CUDA toolkit matching the runner's driver; use the separate CUDA 12.9
    - export NVHPC_CUDA_HOME=${CUDA_HOME:-$(dirname $(dirname $(which -a nvcc | grep -v nvidia_hpc_sdk | head -1)))}
    - export LD_LIBRARY_PATH=${NVHPC_CUDA_HOME}/lib64:${LD_LIBRARY_PATH}
    - echo "NVHPC_CUDA_HOME=${NVHPC_CUDA_HOME}"; nvcc --version | tail -2
  needs: 
    - build-nvhpc-gpu
  allow_failure: true
  rules:
      - if: $CI_TASKS =~ /gpu/    
      - if: $CI_COMMIT_BRANCH =~ /gpu/
      - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_MESSAGE =~ /gpu/'
      - if: $CI_TASKS =~ /all/    
