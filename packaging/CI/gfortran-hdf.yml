build-gfortran-hdf5:
  image: iffregistry.fz-juelich.de/fleur/fleur:gfortran_23102026
  stage: build
  variables:
    FLEUR_CI_FEATURE_OPTIONS: "-libxc TRUE -wannier TRUE -includedir /opt/fleur-deps/mpi/include -libdir /opt/fleur-deps/mpi/lib"
  artifacts:
     paths:
       - build
     expire_in: 12h
  script:
    - cd $CI_PROJECT_DIR
    - VERBOSE=1 FLEUR_INCLUDEDIR="/usr/include /usr/include/hdf5/openmpi" FLEUR_LIBRARIES="-L/usr/lib/x86_64-linux-gnu/hdf5/openmpi;-ldl;-L/usr/lib;-L/usr/lib/x86_64-linux-gnu;-lscalapack-openmpi;-lfftw3" ./configure.sh -c mpi $FLEUR_CI_FEATURE_OPTIONS
    - ./packaging/CI/check-configured-features.sh build false
    - cd build
    - make -j 2
  rules:
    - if: $CI_TASKS =~ /gfortran/  
    - if: $CI_TASKS =~ /all/    
    - if: $CI_TASKS
      when: never
    - when: on_success


    

test-gfortran-hdf5: 
  image: iffregistry.fz-juelich.de/fleur/fleur:gfortran_23102026
  extends: .test-fleur
  variables:
    juDFT_MPI: "mpirun -n {mpi_procs} --allow-run-as-root --mca btl vader,self"
    skip_markers: "masci_tools"
  needs: 
    - fast-test-gfortran-hdf5
    - build-gfortran-hdf5
  rules:
    - if: $CI_TASKS =~ /gfortran/
    - if: $CI_TASKS =~ /all/
    - if: $CI_TASKS
      when: never
    - when: on_success  

fast-test-gfortran-hdf5: 
  image: iffregistry.fz-juelich.de/fleur/fleur:gfortran_23102026
  extends: .test-fleur
  stage: fast-test
  variables:
    markers: "fast"
  needs: 
    - build-gfortran-hdf5
  rules:
    - if: $CI_TASKS =~ /gfortran/  
    - if: $CI_TASKS =~ /all/    
    - if: $CI_TASKS
      when: never
    - when: on_success

