  build-gfortran-hdf5-serial:
  image: iffregistry.fz-juelich.de/fleur/fleur:gfortran
  stage: build
  artifacts:
     paths:
       - build
     expire_in: 12h
  script:
    - cd $CI_PROJECT_DIR
    - FLEUR_INCLUDEDIR="/usr/include /usr/include/hdf5/openmpi" FLEUR_LIBRARIES="-L/usr/lib/x86_64-linux-gnu/hdf5/openmpi;-ldl;-L/usr/lib;-L/usr/lib/x86_64-linux-gnu;-lscalapack-openmpi;-lfftw3" ./configure.sh -c mpi -mpi FALSE $FLEUR_CI_FEATURE_OPTIONS
    - ./packaging/CI/check-configured-features.sh build
    - cd build
    - make -j 2
  rules:
      - if: $CI_TASKS =~ /serial/    
      - if: $CI_TASKS =~ /all/    

test-gfortran-hdf5-serial:
  image: iffregistry.fz-juelich.de/fleur/fleur:gfortran
  extends: .test-fleur
  needs: 
    - build-gfortran-hdf5-serial
  variables:
    BUILD_FOLDER: build
  rules:
    - if: $CI_TASKS =~ /serial/    
    - if: $CI_TASKS =~ /all/    
  
  
build-gfortran-hdf5-debug:
  image: iffregistry.fz-juelich.de/fleur/fleur:gfortran
  stage: build
  artifacts:
     paths:
       - build.debug
     expire_in: 12h
  script:
    - cd $CI_PROJECT_DIR
    - FLEUR_INCLUDEDIR="/usr/include /usr/include/hdf5/openmpi" FLEUR_LIBRARIES="-L/usr/lib/x86_64-linux-gnu/hdf5/openmpi;-ldl;-L/usr/lib;-L/usr/lib/x86_64-linux-gnu;-lscalapack-openmpi;-lfftw3" ./configure.sh -c mpi -mpi FALSE -d -flags "-fcheck=all -finit-real=snan -finit-derived" $FLEUR_CI_FEATURE_OPTIONS
    - ./packaging/CI/check-configured-features.sh build.debug
    - cd build.debug
    - make -j 2
  rules:
      - if: $CI_TASKS =~ /debug/    
      - if: $CI_TASKS =~ /all/    

test-gfortran-serial-hdf5-debug:
  image: iffregistry.fz-juelich.de/fleur/fleur:gfortran
  extends: .test-fleur
  needs: 
    - build-gfortran-hdf5-debug
  variables:
    BUILD_FOLDER: build.debug
  rules:
    - if: $CI_TASKS =~ /debug/    
    - if: $CI_TASKS =~ /all/    
  
