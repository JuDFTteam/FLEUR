build-intel:
  image:
    name: iffregistry.fz-juelich.de/fleur/fleur:oneAPI
    pull_policy: always
  stage: build
  artifacts:
     paths:
       - build.intel
     expire_in: 12h
  script:
    - cd $CI_PROJECT_DIR
    - ./configure.sh -l intel -c auto $FLEUR_CI_FEATURE_OPTIONS
    - ./packaging/CI/check-configured-features.sh build.intel
    - cd build.intel
    - make -j 2
  allow_failure: false
  rules:
      - if: $CI_TASKS =~ /intel/
      - if: $CI_TASKS =~ /all/    

test-intel:
  image:
    name: iffregistry.fz-juelich.de/fleur/fleur:oneAPI
    pull_policy: always
  extends: .test-fleur
  variables:
    BUILD_FOLDER: "build.intel"
  needs: 
    - build-intel
  allow_failure: true
  rules:
      - if: $CI_TASKS =~ /intel/    
      - if: $CI_TASKS =~ /all/    

  
build-intel-debug:
  image:
    name: iffregistry.fz-juelich.de/fleur/fleur:oneAPI
