[project]
name = "fleuriste"
version = "0.1.0"
description = "Terminal-based GUI editor for FLEUR inp.xml files"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "FLEUR Team"}
]
requires-python = ">=3.10"
dependencies = [
    "textual>=0.47.0",
    "click>=8.0",
    "numpy>=1.20.0",
    "ase>=3.22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]
plotting = [
    "textual-plotext>=0.2.0",
]
full = [
    "textual-plotext>=0.2.0",
]

[project.scripts]
fleuriste = "fleuriste.cli:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
where = [".."]
include = ["fleuriste*"]
